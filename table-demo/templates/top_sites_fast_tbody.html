{% for row in rows %}
<tr data-domain="{{ row.domain }}">

  <!-- Checkbox -->
  <td class="text-center">
    <input
      type="checkbox"
      class="form-check-input row-check"
      data-domain="{{ row.domain }}"
      data-rank="{{ row.rank }}"
    >
  </td>

  <!-- Rank -->
  <td class="text-center fw-bold">
    {{ row.rank }}
  </td>

  <!-- Domain + favicon -->
  <td class="domain-cell">
    <a href="http://{{ row.domain }}" target="_blank"
       class="text-decoration-none fw-semibold d-inline-flex align-items-center gap-1">
      <img
        src="https://www.google.com/s2/favicons?domain={{ row.domain }}"
        class="favicon"
        onerror="this.style.display='none'"
        loading="lazy"
      >
      {{ row.domain }}
    </a>
  </td>

  <!-- Title -->
  <td class="title-cell loading" data-domain="{{ row.domain }}">
    
  </td>

  <!-- Analyze -->
  <td class="text-center analyze-cell">
    <button
      type="button"
      class="btn btn-sm btn-outline-info analyze-btn"
      title="IP/GEO-Home&External"
      data-domain="{{ row.domain }}"
    >
      <i class="bi bi-chevron-down"></i>
    </button>
  </td>

  <!-- Status -->
<td class="status-cell text-center" data-domain="{{ row.domain }}">
  <span class="badge bg-secondary">—</span>
</td>



</tr>
{% endfor %}
